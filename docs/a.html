<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ユニクロ ニュース</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="ui.js" data-site="uniqlo-news"></script>
<style>
  /* 色は一覧（index.html）と同じ。 */
  :root {
    --bg: #f4f4f5; --card: #ffffff; --text: #0c0c0d; --muted: #6b6b73;
    --line: rgba(0,0,0,.08); --accent: #e60012; --chip: rgba(0,0,0,.05);
    --badge: #e60012; --header: rgba(255,255,255,.86); --quote: rgba(230,0,18,.06);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c; --card: #161618; --text: #f3f3f4; --muted: #9d9da6;
      --line: rgba(255,255,255,.08); --accent: #ff3b3b; --chip: rgba(255,255,255,.07);
      --badge: #ff3b3b; --header: rgba(11,11,12,.82); --quote: rgba(255,59,59,.1);
      --shadow: 0 0 0 1px rgba(255,255,255,.05);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Segoe UI", sans-serif;
    font-feature-settings: "palt"; letter-spacing: .02em;
    line-height: 1.85; -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  a { color: var(--accent); text-decoration: none; }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--header);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar { max-width: 720px; height: 52px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
  .back { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 4px; }
  .brandmark { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--text); }
  .logo { background: var(--accent); color: #fff; border-radius: 3px; font-size: 9px; font-weight: 800; letter-spacing: .1em; line-height: 1; padding: 5px 5px 5px 6px; }
  .wordmark { font-size: 16px; font-weight: 900; letter-spacing: .12em; line-height: 1; }
  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tag { background: var(--chip); border-radius: 4px; padding: 2px 8px; color: var(--text); }
  .brand { border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; color: var(--text); font-weight: 600; }
  .badge { background: var(--badge); color: #fff; border-radius: 4px; padding: 2px 8px; font-weight: 600; }
  h1 { font-size: 25px; font-weight: 800; line-height: 1.5; letter-spacing: .02em; margin: 0 0 16px; }
  .cover { width: 100%; aspect-ratio: 16 / 9; max-height: 380px; object-fit: cover; border-radius: 16px; background: var(--chip); display: block; margin-bottom: 20px; box-shadow: var(--shadow); }
  .points {
    position: relative; overflow: hidden; background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 16px 18px 16px 22px; margin: 0 0 24px;
  }
  .points::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent); }
  .points h2 { font-size: 12px; color: var(--accent); margin: 0 0 8px; letter-spacing: .08em; font-weight: 800; }
  .points ul { margin: 0; padding-left: 20px; }
  .points li { font-size: 14.5px; margin-bottom: 5px; }
  .points li:last-child { margin-bottom: 0; }
  .body p { font-size: 16px; margin: 0 0 18px; }
  .actions { display: flex; flex-direction: column; gap: 9px; margin: 26px 0 20px; }
  .btn {
    display: block; text-align: center; padding: 14px; border-radius: 999px;
    font-size: 15px; font-weight: 700; border: 1px solid var(--line);
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.sub { background: var(--card); color: var(--accent); }
  .note { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  .note p { margin: 0 0 7px; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="back" href="./">‹ 一覧へ戻る</a>
    <a class="brandmark" href="./" aria-label="ユニクロ ニュース トップへ"><span class="logo">UNIQLO</span><span class="wordmark">NEWS</span></a>
  </div>
</header>

<main id="main"><p class="loading">読み込み中…</p></main>

<script>
const params = new URLSearchParams(location.search);
const id = (params.get("id") || "").replace(/[^0-9a-f]/g, "");

const fmt = new Intl.DateTimeFormat("ja-JP", {
  year: "numeric", month: "numeric", day: "numeric",
  hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo"
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Google翻訳を通した原文ページ。1タップで日本語の全文が読める。
function translated(url) {
  return "https://translate.google.com/translate?sl=auto&tl=ja&u=" + encodeURIComponent(url);
}

async function load() {
  const main = document.getElementById("main");
  if (!id) { location.replace("./"); return; }
  try {
    const res = await fetch(`articles/${id}.json`, { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    const a = await res.json();
    document.title = `${a.title_ja} | ユニクロ ニュース`;

    const paragraphs = String(a.body).split(/\n{2,}|\n/).map(p => p.trim()).filter(Boolean);
    main.innerHTML = `
      <div class="meta">
        ${a.importance >= 4 ? '<span class="badge">注目</span>' : ""}
        <span class="brand">${escapeHtml(a.brand || "ユニクロ")}</span>
        <span class="tag">${escapeHtml(a.category)}</span>
        <span>${a.region === "jp" ? "🇯🇵" : "🌍"} ${escapeHtml(a.source)}</span>
        <span>・${fmt.format(new Date(a.published))}</span>
      </div>
      <h1>${escapeHtml(a.title_ja)}</h1>
      ${a.image ? `<img class="cover" src="${escapeHtml(a.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="points">
        <h2>この記事の要点</h2>
        <ul>${a.points.map(p => `<li>${escapeHtml(p)}</li>`).join("")}</ul>
      </div>
      <div class="body">${paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join("")}</div>
      <div class="actions">
        ${a.lang === "ja" ? "" : `<a class="btn primary" href="${escapeHtml(translated(a.url))}" target="_blank" rel="noopener noreferrer">原文を日本語で全文読む（Google翻訳）</a>`}
        <a class="btn sub" href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer">${a.lang === "ja" ? "原文を読む" : "原文（英語）を読む"}：${escapeHtml(a.source)}</a>
      </div>
      <div class="note">
        <p>この解説は、${escapeHtml(a.source)}の記事をもとにAIが日本語で書き起こしたものです。原文の翻訳ではありません。正確な内容と最新の情報は出典元の記事をご確認ください。</p>
        <p>価格・発売日・在庫は変わることがあります。購入の前にユニクロ公式サイトおよび各店舗の告知をご確認ください。</p>
        <p>記事および画像の著作権は${escapeHtml(a.source)}に帰属します。このサイトは個人が運営する非公式のニュースまとめです。</p>
      </div>`;
    if (window.uiAttachDetail) uiAttachDetail(a);   // 日付の行に「☆ お気に入り」を足す
  } catch (err) {
    main.innerHTML = '<p class="loading">記事が見つかりませんでした。<br><a href="./">一覧へ戻る</a></p>';
  }
}

load();
</script>
</body>
</html>
